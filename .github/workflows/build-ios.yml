name: Build iOS IPA

# Builds an .ipa for iPhone from the Flutter app.
#
# Two modes:
#   * Unsigned  (default)  -> no Apple Developer account required. Good for
#                             testing the build / sideloading with tools that
#                             re-sign (AltStore, Sideloadly, TrollStore, etc.).
#   * Signed    -> set the secrets below and run with "unsigned = false".
#                  Produces a distribution-ready IPA.
#
# Required secrets/vars (only for SIGNED builds) — canonical Apple-Actions names:
#   vars.APPSTORE_ISSUER_ID              App Store Connect API Issuer ID
#   vars.APPSTORE_API_KEY_ID             App Store Connect API Key ID
#   secrets.APPSTORE_API_PRIVATE_KEY     Contents of the .p8 API key
#   secrets.APPSTORE_CERTIFICATES_FILE_BASE64  Base64 of your .p12 signing cert
#   secrets.APPSTORE_CERTIFICATES_PASSWORD     Password for that .p12
# Optional:
#   vars.BUNDLE_ID                       Overrides com.example.task3

on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: Build an unsigned IPA (no Apple account needed)
        type: boolean
        default: true
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: '3.47.4'
  # Non-secret: an empty value means "unsigned mode".
  APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
  APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
  BUNDLE_ID: ${{ vars.BUNDLE_ID }}
  TEAM_ID: ${{ vars.TEAM_ID }}

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Override bundle identifier (optional)
        if: ${{ env.BUNDLE_ID != '' }}
        run: |
          echo "Overriding bundle id to $BUNDLE_ID"
          /usr/bin/sed -i '' "s/com\.example\.task3/$BUNDLE_ID/g" ios/Runner.xcodeproj/project.pbxproj

      # ---------------------------------------------------------------------
      # SIGNED build (requires Apple secrets; skipped for unsigned runs)
      # ---------------------------------------------------------------------
      - name: Write App Store Connect API key
        if: ${{ env.APPSTORE_API_KEY_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.unsigned) }}
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

      - name: Import code signing certificate
        if: ${{ env.APPSTORE_API_KEY_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.unsigned) }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profile
        if: ${{ env.APPSTORE_API_KEY_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.unsigned) }}
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.BUNDLE_ID != '' && env.BUNDLE_ID || 'com.example.task3' }}
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Build signed IPA
        id: signed
        if: ${{ env.APPSTORE_API_KEY_ID != '' && !(github.event_name == 'workflow_dispatch' && inputs.unsigned) }}
        run: |
          EFFECTIVE_BUNDLE_ID="${BUNDLE_ID:-com.example.task3}"
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "Building $EFFECTIVE_BUNDLE_ID (team ${TEAM_ID})"
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # ---------------------------------------------------------------------
      # UNSIGNED build (default; mutually exclusive with the signed branch)
      # ---------------------------------------------------------------------
      - name: Build unsigned iOS app
        id: unsigned
        if: ${{ env.APPSTORE_API_KEY_ID == '' || (github.event_name == 'workflow_dispatch' && inputs.unsigned) }}
        run: |
          flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: steps.unsigned.outcome == 'success'
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p build/ipa_payload/Payload
          cp -R "$APP_PATH" build/ipa_payload/Payload/
          cd build/ipa_payload
          zip -qry ../task3-unsigned.ipa Payload
          cd ../..
          ls -lh build/task3-unsigned.ipa

      # ---------------------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------------------
      - name: Upload signed IPA
        if: steps.signed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task3-ipa-signed
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload unsigned IPA
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: task3-ipa-unsigned
          path: build/task3-unsigned.ipa
          if-no-files-found: error

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: task3-dsyms
          path: build/ios/archive/Runner.xcarchive/dSYMs/**
          if-no-files-found: ignore

      # ---------------------------------------------------------------------
      # Attach IPA to GitHub Release on version tags
      # ---------------------------------------------------------------------
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ios/ipa/*.ipa
            build/task3-unsigned.ipa
          fail_on_unmatched_files: false
